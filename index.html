<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Keo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Manrope:wght@300;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --wine: #6b1226;
            --rose: #e9b8c0;
            --ivory: #f4ece1;
            --ink: #08040a;
            --soft: #b9a7aa;
            --serif: "Cormorant Garamond", Georgia, serif;
            --sans: "Manrope", system-ui, sans-serif
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            background: var(--ink)
        }

        body {
            background: var(--ink);
            color: var(--ivory);
            font-family: var(--sans);
            font-weight: 300;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased
        }

        body.locked {
            overflow: hidden;
            height: 100vh
        }

        img {
            display: block;
            max-width: 100%
        }

        #dust {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none
        }

        .grain {
            position: fixed;
            inset: -50%;
            z-index: 50;
            pointer-events: none;
            opacity: .09;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
            animation: gr 1s steps(4) infinite
        }

        @keyframes gr {
            25% {
                transform: translate(-3%, 2%)
            }

            50% {
                transform: translate(2%, -3%)
            }

            75% {
                transform: translate(-2%, -1%)
            }
        }

        .cursor {
            position: fixed;
            left: 0;
            top: 0;
            width: 14px;
            height: 14px;
            margin: -7px 0 0 -7px;
            border: 1px solid var(--rose);
            border-radius: 50%;
            z-index: 100;
            pointer-events: none;
            mix-blend-mode: difference
        }

        .cursor.big {
            width: 60px;
            height: 60px;
            margin: -30px 0 0 -30px;
            background: rgba(233, 184, 192, .15)
        }

        @media (pointer:coarse) {
            .cursor {
                display: none
            }
        }

        section {
            position: relative;
            z-index: 2
        }

        .serif {
            font-family: var(--serif)
        }

        .ch {
            display: inline-block;
            will-change: transform, opacity
        }

        /* INTRO */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 60%, #1a0710 0%, #08040a 70%);
            padding: 24px;
            text-align: center
        }

        #intro h1 {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(1.5rem, 5.2vw, 4rem);
            letter-spacing: .14em;
            line-height: 1.25;
            max-width: 14em
        }

        #introBtn {
            margin-top: 3.2rem;
            background: none;
            border: 1px solid rgba(233, 184, 192, .5);
            color: var(--ivory);
            padding: 1.1rem 2.6rem;
            letter-spacing: .35em;
            font: inherit;
            font-size: .75rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0
        }

        #introBtn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--wine);
            transform: translateY(101%);
            transition: transform .6s cubic-bezier(.2, .8, .2, 1);
            z-index: -1
        }

        #introBtn:hover::before {
            transform: none
        }

        #introBtn:hover {
            border-color: var(--rose)
        }

        #bloom {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 40px;
            height: 40px;
            margin: -20px;
            border-radius: 50%;
            z-index: 61;
            pointer-events: none;
            background: radial-gradient(circle, #ffe9e1, #e9b8c0 40%, transparent 70%);
            opacity: 0
        }

        /* HEART */
        #heart {
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 50%, #2a0a16 0%, #08040a 75%)
        }

        #heart .cam {
            position: absolute;
            inset: 0;
            perspective: 1100px
        }

        #heart .stage {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d
        }

        .tile {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            will-change: transform
        }

        .tile .in {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: box-shadow .4s;
            backface-visibility: hidden
        }

        .tile .in img {
            position: absolute;
            max-width: none;
            object-fit: cover
        }

        .tile:hover {
            z-index: 20
        }

        .tile:hover .in {
            box-shadow: 0 0 36px 4px rgba(233, 184, 192, .6)
        }

        #heartShine {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 235, 225, .28) 50%, transparent 60%);
            mix-blend-mode: soft-light;
            opacity: 0;
            transform: translateX(-100%)
        }

        #heartGlow {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 90vmin;
            height: 90vmin;
            margin: -45vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(190, 40, 70, .55), transparent 65%);
            filter: blur(30px);
            opacity: 0
        }

        .heartTitle {
            position: absolute;
            left: 6vw;
            bottom: 9vh;
            z-index: 5;
            max-width: min(26rem, 70vw);
            pointer-events: none
        }

        .heartTitle h2 {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(1.9rem, 5vw, 4rem);
            line-height: 1.05
        }

        .heartTitle h2 em {
            color: var(--rose)
        }

        .heartTitle p {
            margin-top: 1rem;
            color: var(--soft);
            font-size: .85rem;
            letter-spacing: .08em
        }

        /* GALLERY */
        #gallery {
            padding: 24vh 6vw 20vh;
            background: linear-gradient(#08040a, #14070d 30%, #14070d 80%, #0d0509)
        }

        #gallery .head {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(2.4rem, 8vw, 7rem);
            line-height: .95;
            margin-bottom: 16vh
        }

        #gallery .head span {
            display: block;
            margin-left: 22vw;
            color: var(--rose);
            font-style: italic
        }

        .gal {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 0 2vw;
            align-items: start
        }

        .fig {
            position: relative;
            will-change: transform
        }

        .fig .frame {
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .55);
            transition: transform .8s cubic-bezier(.2, .8, .2, 1)
        }

        .fig img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(.2, .8, .2, 1)
        }

        .fig:hover img {
            transform: scale(1.07)
        }

        .fig:hover .frame {
            box-shadow: 0 0 70px rgba(233, 184, 192, .3), 0 30px 60px rgba(0, 0, 0, .55)
        }

        .fig figcaption {
            font-family: var(--serif);
            font-style: italic;
            font-size: 1.25rem;
            margin-top: .8rem;
            color: var(--rose);
            opacity: .55;
            transition: opacity .5s, transform .5s;
            transform: translateY(6px)
        }

        .fig:hover figcaption {
            opacity: 1;
            transform: none
        }

        .fig .no {
            position: absolute;
            top: -1.2rem;
            left: 0;
            font-size: .65rem;
            letter-spacing: .3em;
            color: var(--soft)
        }

        .reveal {
            position: absolute;
            inset: 0;
            background: #14070d;
            z-index: 2
        }

        .g1 {
            grid-column: 2/7;
            aspect-ratio: 3/4
        }

        .g2 {
            grid-column: 8/12;
            aspect-ratio: 1;
            margin-top: 22vh
        }

        .g3 {
            grid-column: 3/9;
            aspect-ratio: 4/3;
            margin-top: -2vh;
            z-index: 2
        }

        .g4 {
            grid-column: 9/13;
            aspect-ratio: 3/4;
            margin-top: -18vh
        }

        .fig .frame {
            width: 100%;
            height: 100%
        }

        .fig {
            height: auto
        }

        .fig .frame {
            aspect-ratio: inherit
        }

        .g1 .frame,
        .g2 .frame,
        .g3 .frame,
        .g4 .frame {
            aspect-ratio: auto;
            height: 100%
        }

        .fig {
            display: flex;
            flex-direction: column
        }

        .fig .frame {
            flex: 1
        }

        /* LETTER */
        #letter {
            min-height: 130vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14vh 5vw;
            background: radial-gradient(ellipse at 50% 50%, #3a1220, #0d0509 70%);
            text-align: center
        }

        #letter .hint {
            font-size: .7rem;
            letter-spacing: .4em;
            color: var(--soft);
            margin-bottom: 3rem
        }

        .env {
            position: relative;
            width: min(88vw, 420px);
            aspect-ratio: 1.5;
            perspective: 1200px;
            cursor: pointer
        }

        .env .back,
        .env .front {
            position: absolute;
            inset: 0;
            border-radius: 4px
        }

        .env .back {
            background: #7a1a2e;
            box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 100px rgba(200, 60, 90, .2)
        }

        .env .front {
            background: linear-gradient(160deg, #a02a42, #6b1226);
            clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
            z-index: 4
        }

        .env .flap {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(#b8324d, #8b1b33);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            z-index: 5;
            backface-visibility: visible
        }

        .env .seal {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 44px;
            height: 44px;
            margin: -4px 0 0 -22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #e8b4bc, #a9344b 60%);
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .5)
        }

        .paper {
            position: absolute;
            left: 6%;
            width: 88%;
            top: 6%;
            height: 88%;
            background: var(--ivory);
            color: #2a1218;
            z-index: 3;
            border-radius: 2px;
            padding: 6% 7%;
            overflow: hidden;
            text-align: left;
            font-family: var(--serif);
            font-size: clamp(.9rem, 3.5vw, 1.15rem);
            line-height: 1.55
        }

        .paper.open {
            overflow: visible
        }

        .paper p {
            opacity: 1
        }

        #paperWrap {
            width: min(92vw, 560px)
        }

        .sheet {
            background: var(--ivory);
            color: #2a1218;
            padding: clamp(1.6rem, 6vw, 3.4rem);
            text-align: left;
            font-family: var(--serif);
            font-size: clamp(1.05rem, 3.6vw, 1.45rem);
            line-height: 1.65;
            box-shadow: 0 40px 90px rgba(0, 0, 0, .6), 0 0 120px rgba(255, 170, 140, .18);
            background-image: linear-gradient(#f4ece1, #eadccb);
            display: none
        }

        .sheet p {
            margin-bottom: 1rem
        }

        .sheet .to {
            font-style: italic
        }

        .sheet .from {
            text-align: right;
            font-style: italic;
            margin-top: 1.6rem
        }

        footer {
            height: 14vh;
            background: #0d0509;
            position: relative;
            z-index: 2
        }

        @media (max-width:700px) {
            .g1 {
                grid-column: 1/10
            }

            .g2 {
                grid-column: 5/13;
                margin-top: 8vh
            }

            .g3 {
                grid-column: 1/13;
                margin-top: 6vh
            }

            .g4 {
                grid-column: 5/13;
                margin-top: 6vh
            }

            #gallery .head span {
                margin-left: 8vw
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .grain {
                animation: none
            }
        }
    </style>
</head>

<body class="locked">
    <canvas id="dust"></canvas>
    <div class="grain"></div>
    <div class="cursor"></div>

    <div id="intro">
        <h1 id="introText"></h1>
        <button id="introBtn" data-hover></button>
    </div>
    <div id="bloom"></div>

    <main id="story">
        <section id="heart">
            <div id="heartGlow"></div>
            <div id="heartShine"></div>
            <div class="cam">
                <div class="stage" id="stage"></div>
            </div>
            <div class="heartTitle">
                <h2 id="hTitle"></h2>
                <p id="hSub"></p>
            </div>
        </section>

        <section id="gallery">
            <h2 class="head" id="galHead"></h2>
            <div class="gal" id="gal"></div>
        </section>

        <section id="letter">
            <p class="hint" id="letterHint"></p>
            <div class="env" id="env" data-hover>
                <div class="back"></div>
                <div class="paper"></div>
                <div class="front"></div>
                <div class="flap" id="flap"></div>
                <div class="seal"></div>
            </div>
            <div id="paperWrap">
                <div class="sheet" id="sheet"></div>
            </div>
        </section>

        <footer></footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        /* ============================================================
           CẤU HÌNH — chỉnh sửa tại đây
           ============================================================ */
        const CONFIG = {
            herName: "Keo",                                   // ← tên cô ấy
            introText: "Minh Dang",
            openButton: "OPEN MY HEART",
            heartTitle: "",
            heartSub: "",
            galleryTitle: ["Minh", "Khue"],
            letterHint: "CHẠM VÀO PHONG BÌ",
            letter: {                                        // ← nội dung thư
                to: "Nguyen Minh Khue,",
                lines: [
                    "Anh không giỏi nói những điều lớn lao. Nhưng mỗi lần nghĩ về em, mọi thứ trong anh đều chậm lại và dịu đi.",
                    "Cảm ơn em vì những ngày bình thường đã trở nên đặc biệt, chỉ vì có em bên cạnh.",
                    "Nếu có thể, anh muốn giữ lại tất cả: tiếng cười của em, cách em nhìn anh, và cả những lần chúng ta chẳng nói gì mà vẫn hiểu nhau."
                ],
                from: "Minh Dang, gửi."
            },
            // ← 4 ẢNH của hai bạn (đổi tên file / chú thích / thứ tự tại đây)
            // Trái tim được chia 4 vùng: mỗi ảnh là một phần của trái tim.
            // Thứ tự vùng: 1 = thùy trái trên, 2 = thùy phải trên, 3 = nửa dưới trái, 4 = nửa dưới phải.
            photos: [
                {src: "NguyenMinhKhue1.jpg", cap: ""},
                {src: "NguyenMinhKhue2.jpg", cap: ""},
                {src: "NguyenMinhKhue3.jpg", cap: ""},
                {src: "NguyenMinhKhue4.jpg", cap: ""}
            ],
            heartTiles: {desktop: 260, mobile: 100}         // số ảnh ghép thành trái tim
        };

        /* ============================================================
           HELPERS
           ============================================================ */
        gsap.registerPlugin(ScrollTrigger);
        const $ = s => document.querySelector(s);
        const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const FINE = matchMedia("(pointer:fine)").matches;
        const isMobile = () => innerWidth < 768;
        const P = CONFIG.photos;

        function splitChars(el, text) {
            el.innerHTML = "";
            [...text].forEach(c => {const s = document.createElement("span"); s.className = "ch"; s.innerHTML = c === " " ? "&nbsp;" : c; el.appendChild(s);});
            return el.querySelectorAll(".ch");
        }
        function splitWords(el, text) {
            el.innerHTML = "";
            text.split(" ").forEach(w => {const s = document.createElement("span"); s.className = "ch"; s.textContent = w; el.append(s, " ");});
            return el.querySelectorAll(".ch");
        }
        function placeholder(i) { // ảnh tạm khi chưa có file
            const h = [345, 350, 10, 330, 355, 320][i % 6], h2 = (h + 25) % 360;
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},55%,${28 + (i * 7) % 22}%)'/><stop offset='1' stop-color='hsl(${h2},45%,12%)'/></linearGradient></defs><rect width='300' height='400' fill='url(%23g)'/><circle cx='${60 + (i * 53) % 180}' cy='${90 + (i * 71) % 200}' r='70' fill='white' opacity='.07'/></svg>`;
            return "data:image/svg+xml;utf8," + svg;
        }
        function makeImg(i, cls) {
            const img = new Image();
            img.className = cls || ""; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
            const p = P[i % P.length];
            img.src = p.src;
            img.onerror = () => {img.onerror = null; img.src = placeholder(i);};
            return img;
        }

        /* ============================================================
           DUST / STARS (một canvas dùng chung)
           ============================================================ */
        const dust = {night: 0, boost: 0};
        (function () {
            const cv = $("#dust"), cx = cv.getContext("2d");
            let W, H, pts = [], dpr = Math.min(devicePixelRatio || 1, 2);
            function init() {
                W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
                const n = isMobile() ? 45 : 110;
                pts = Array.from({length: n}, () => ({x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.4 + .4) * dpr, s: Math.random() * .3 + .05, ph: Math.random() * 6.28}));
            }
            init(); addEventListener("resize", init);
            let t = 0;
            gsap.ticker.add(() => {
                t += .016; cx.clearRect(0, 0, W, H);
                for (const p of pts) {
                    if (!REDUCED) {p.y -= p.s * dpr * (1 + dust.boost * 2) * (1 - dust.night * .9); p.x += Math.sin(t + p.ph) * .15 * dpr; if (p.y < -5) {p.y = H + 5; p.x = Math.random() * W} }
                    const tw = .5 + .5 * Math.sin(t * (1 + dust.night * 2) + p.ph);
                    const a = (.25 + .35 * tw) * (1 + dust.boost * .8);
                    const g = dust.night; // 0 hồng ấm → 1 trắng xanh sao
                    cx.fillStyle = `rgba(${255 - g * 40 | 0},${200 + g * 35 | 0},${205 + g * 50 | 0},${Math.min(a, .9)})`;
                    cx.beginPath(); cx.arc(p.x, p.y, p.r * (1 + dust.boost * .6), 0, 6.283); cx.fill();
                }
            });
        })();

        /* ============================================================
           CURSOR (desktop)
           ============================================================ */
        if (FINE) {
            const c = $(".cursor"), qx = gsap.quickTo(c, "x", {duration: .35, ease: "power3"}), qy = gsap.quickTo(c, "y", {duration: .35, ease: "power3"});
            addEventListener("pointermove", e => {qx(e.clientX); qy(e.clientY)});
            document.addEventListener("pointerover", e => {c.classList.toggle("big", !!e.target.closest("[data-hover],.tile,.fig"));});
        }

        /* ============================================================
           INTRO
           ============================================================ */
        const introH = $("#introText"), btn = $("#introBtn");
        btn.textContent = CONFIG.openButton;
        const introChars = splitChars(introH, CONFIG.introText);
        gsap.set(introChars, {opacity: 0, y: 30, rotateX: -80, filter: "blur(10px)"});
        gsap.timeline({delay: .6})
            .to(introChars, {opacity: 1, y: 0, rotateX: 0, filter: "blur(0px)", duration: 1.1, ease: "power3.out", stagger: .05})
            .to("#intro", {background: "radial-gradient(ellipse at 50% 55%,#3a0f1c 0%,#08040a 75%)", duration: 2}, "<.5")
            .to(btn, {opacity: 1, duration: 1.2}, "-=.8");

        btn.addEventListener("click", () => {
            btn.disabled = true;
            gsap.timeline()
                .set("#bloom", {opacity: 1, scale: 1})
                .to("#bloom", {scale: 60, duration: 1.3, ease: "power3.in"})
                .to("#intro", {
                    opacity: 0, duration: .8, onComplete: () => {
                        $("#intro").remove(); document.body.classList.remove("locked");
                        window.scrollTo(0, 0); ScrollTrigger.refresh();
                    }
                }, "-=.2")
                .to("#bloom", {opacity: 0, duration: 1.2});
        });

        /* ============================================================
           HEART OF MEMORIES — mosaic ghép đúng đường cong trái tim
           Lưới ô được lọc bằng phương trình trái tim:
           (x²+y²-1)³ - x²·y³ ≤ 0 → mỗi ô là một bức ảnh.
           ============================================================ */
        let heartCtx;
        function heartCells(target) {
            let step = .3, pts;
            for (let k = 0; k < 60; k++) {
                pts = [];
                for (let y = -1.25; y <= 1.35; y += step) for (let x = -1.35; x <= 1.35; x += step) {
                    const a = x * x + y * y - 1; if (a * a * a - x * x * y * y * y <= 0) pts.push([x, y]);
                }
                if (pts.length >= target) break; step *= .96;
            }
            return {pts, step};
        }
        function buildHeart() {
            if (heartCtx) heartCtx.revert();
            const stage = $("#stage"); stage.innerHTML = "";
            const {pts, step} = heartCells(isMobile() ? CONFIG.heartTiles.mobile : CONFIG.heartTiles.desktop);
            const vw = innerWidth, vh = innerHeight;
            const unit = Math.min(vw * .86, vh * .78 * 1.15) / 2.7, size = step * unit;
            // chia trái tim thành 4 vùng, mỗi vùng là 1 ảnh liền mạch được cắt thành mảnh
            const reg = p => (p[1] > 0 ? 0 : 2) + (p[0] < 0 ? 0 : 1), bb = [0, 1, 2, 3].map(() => ({x0: 9, x1: -9, y0: 9, y1: -9}));
            pts.forEach(p => {const b = bb[reg(p)]; b.x0 = Math.min(b.x0, p[0] - step / 2); b.x1 = Math.max(b.x1, p[0] + step / 2); b.y0 = Math.min(b.y0, p[1] - step / 2); b.y1 = Math.max(b.y1, p[1] + step / 2)});
            const imgs = [0, 1, 2, 3].map(k => {const im = makeImg(k); im.loading = "eager"; return im});
            const tiles = pts.map(([x, y], i) => {
                const r = reg([x, y]), b = bb[r];
                const d = document.createElement("div"); d.className = "tile";
                d.style.width = d.style.height = (size + 1.5) + "px";
                const inn = document.createElement("div"); inn.className = "in";
                const im = imgs[r].cloneNode(); im.onerror = () => {im.onerror = null; im.src = placeholder(r)};
                im.style.width = (b.x1 - b.x0) * unit + "px"; im.style.height = (b.y1 - b.y0) * unit + "px";
                im.style.left = -((x - step / 2 - b.x0) * unit) + "px"; im.style.top = -((b.y1 - (y + step / 2)) * unit) + "px";
                inn.appendChild(im); d.appendChild(inn); stage.appendChild(d);
                return {d, x: x * unit, y: -y * unit + vh * .02, i, dist: Math.hypot(x, y)};
            });
            heartCtx = gsap.context(() => {
                const R = (a, b) => a + Math.random() * (b - a);
                tiles.forEach(t => gsap.set(t.d, {xPercent: -50, yPercent: -50}));
                if (REDUCED) {tiles.forEach(t => gsap.set(t.d, {x: t.x, y: t.y})); gsap.set("#heartGlow", {opacity: .7}); return;}
                const tl = gsap.timeline({defaults: {ease: "none"}, scrollTrigger: {trigger: "#heart", start: "top top", end: "+=260%", pin: true, scrub: 1.2, anticipatePin: 1}});
                tiles.forEach(t => {
                    const sc = R(.5, 1.9), near = Math.random() < .2;
                    gsap.set(t.d, {x: R(-vw * .9, vw * .9), y: R(-vh * .9, vh * .9), z: R(-900, near ? 500 : 200), rotateX: R(-70, 70), rotateY: R(-90, 90), rotateZ: R(-60, 60), scale: sc, opacity: 0});
                });
                // 0–0.15: ảnh hiện ra rải rác & trôi
                tl.to(tiles.map(t => t.d), {opacity: .85, duration: .15, stagger: {amount: .1}}, 0);
                // 0.15–0.7: hội tụ thành trái tim
                tiles.forEach(t => tl.to(t.d, {x: t.x, y: t.y, z: 0, rotateX: 0, rotateY: 0, rotateZ: 0, scale: 1, opacity: 1, duration: .4, ease: "power3.inOut"}, .15 + t.dist * .12 + Math.random() * .1));
                tl.fromTo("#hTitle", {opacity: 0, y: 30}, {opacity: 1, y: 0, duration: .15}, .1)
                    .fromTo("#hSub", {opacity: 0}, {opacity: 1, duration: .1}, .2)
                    .to("#heartGlow", {opacity: .9, scale: 1.1, duration: .25}, .7)
                    .fromTo("#heartShine", {x: "-100%", opacity: 0}, {x: "100%", opacity: 1, duration: .25, ease: "power1.inOut"}, .72)
                    .to(dust, {boost: 1, duration: .3}, .7)
                    // camera tiến lại gần
                    .to("#heart .cam", {scale: 1.35, duration: .3, ease: "power2.inOut"}, .75)
                    .to("#hTitle,#hSub", {opacity: 0, duration: .1}, .8)
                    .to("#heart .cam", {opacity: .0, scale: 2.2, duration: .15, ease: "power2.in"}, .95)
                    .to("#heartGlow", {opacity: 0, duration: .15}, .95)
                    .to(dust, {boost: 0, duration: .15}, .95);
                // hover: tile nổi lên + xoay nhẹ theo chuột
                if (FINE) {
                    tiles.forEach(t => {
                        const ph = t.d.firstChild;
                        t.d.addEventListener("mouseenter", () => gsap.to(ph, {z: 80, scale: 1.35, duration: .5, ease: "power3.out", overwrite: true}));
                        t.d.addEventListener("mouseleave", () => gsap.to(ph, {z: 0, scale: 1, duration: .7, ease: "power3.out", overwrite: true}));
                    });
                    const rx = gsap.quickTo(stage, "rotateX", {duration: 1, ease: "power2"}), ry = gsap.quickTo(stage, "rotateY", {duration: 1, ease: "power2"});
                    const mv = e => {ry((e.clientX / innerWidth - .5) * 14); rx(-(e.clientY / innerHeight - .5) * 10)};
                    addEventListener("pointermove", mv); heartCtx.add(() => () => removeEventListener("pointermove", mv));
                }
            });
        }
        $("#hTitle").innerHTML = CONFIG.heartTitle; $("#hSub").textContent = CONFIG.heartSub;
        buildHeart();
        let lastW = innerWidth, rt;
        addEventListener("resize", () => {clearTimeout(rt); rt = setTimeout(() => {if (Math.abs(innerWidth - lastW) > 80) {lastW = innerWidth; buildHeart(); ScrollTrigger.refresh()} }, 300)});

        /* ============================================================
           GALLERY
           ============================================================ */
        (function () {
            const head = $("#galHead");
            head.innerHTML = `${CONFIG.galleryTitle[0]}<span>${CONFIG.galleryTitle[1]}</span>`;
            gsap.from(head.childNodes, {y: 80, opacity: 0, duration: 1.4, ease: "power4.out", stagger: .2, scrollTrigger: {trigger: head, start: "top 80%"}});
            const gal = $("#gal"), speeds = [-50, 70, -30, 90];
            for (let i = 0; i < 4; i++) {
                const f = document.createElement("figure"); f.className = `fig g${i + 1}`;
                f.style.perspective = "900px"; f.innerHTML = `<span class="no">0${i + 1}</span><div class="frame"><div class="reveal"></div></div><figcaption>${P[i].cap || ""}</figcaption>`;
                f.querySelector(".frame").prepend(makeImg(i)); gal.appendChild(f);
                if (REDUCED) {f.querySelector(".reveal").remove(); continue;}
                // reveal bằng clip + ảnh co lại
                gsap.to(f.querySelector(".reveal"), {yPercent: -101, duration: 1.4, ease: "power4.inOut", scrollTrigger: {trigger: f, start: "top 85%"}});
                gsap.from(f.querySelector("img"), {scale: 1.35, duration: 2, ease: "power3.out", scrollTrigger: {trigger: f, start: "top 85%"}});
                // parallax
                gsap.fromTo(f, {y: -speeds[i]}, {y: speeds[i], ease: "none", scrollTrigger: {trigger: f, start: "top bottom", end: "bottom top", scrub: true}});
                // floating 3D cho vài ảnh
                if (i % 2 === 0) gsap.to(f.querySelector(".frame"), {rotateZ: i % 4 === 0 ? 1.6 : -1.6, y: -10, duration: 3.5 + i * .3, ease: "sine.inOut", repeat: -1, yoyo: true});
                // ảnh trượt nhẹ bên trong khung khi cuộn
                gsap.fromTo(f.querySelector("img"), {yPercent: -6}, {yPercent: 6, ease: "none", scrollTrigger: {trigger: f, start: "top bottom", end: "bottom top", scrub: true}});
                // nghiêng 3D theo chuột + vệt sáng
                if (FINE) {
                    const fr = f.querySelector(".frame"), rx = gsap.quickTo(fr, "rotateX", {duration: .6}), ry = gsap.quickTo(fr, "rotateY", {duration: .6});
                    f.addEventListener("pointermove", e => {const r = f.getBoundingClientRect(); ry((e.clientX - r.left) / r.width * 16 - 8); rx(-((e.clientY - r.top) / r.height * 12 - 6))});
                    f.addEventListener("pointerleave", () => {ry(0); rx(0)});
                }
            }
        })();

        /* ============================================================
           LETTER
           ============================================================ */
        (function () {
            $("#letterHint").textContent = CONFIG.letterHint;
            const L = CONFIG.letter, sheet = $("#sheet");
            sheet.innerHTML = `<p class="to"></p>${L.lines.map(() => "<p></p>").join("")}<p class="from"></p>`;
            const ps = [...sheet.querySelectorAll("p")], texts = [L.to, ...L.lines, L.from];
            ps.forEach((p, i) => splitChars(p, texts[i]));
            const allCh = sheet.querySelectorAll(".ch");
            gsap.set(allCh, {opacity: 0});
            gsap.fromTo("#env", {y: 80, opacity: 0, rotateX: 25}, {y: 0, opacity: 1, rotateX: 0, duration: 1.4, ease: "power3.out", scrollTrigger: {trigger: "#letter", start: "top 60%"}});
            gsap.to("#env", {y: -12, duration: 2.6, ease: "sine.inOut", repeat: -1, yoyo: true});
            // cánh hoa rơi nhẹ
            if (!REDUCED) for (let i = 0; i < (isMobile() ? 8 : 16); i++) {
                const p = document.createElement("div");
                p.style.cssText = "position:absolute;top:-30px;left:" + Math.random() * 100 + "%;width:12px;height:16px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#e9b8c0,#a9344b);opacity:.7;pointer-events:none;z-index:1";
                $("#letter").appendChild(p);
                gsap.to(p, {y: "+=" + (innerHeight * 1.5), x: "+=" + gsap.utils.random(-120, 120), rotation: gsap.utils.random(-300, 300), duration: gsap.utils.random(9, 16), repeat: -1, delay: gsap.utils.random(0, 10), ease: "none"});
            }
            let opened = false;
            $("#env").addEventListener("click", () => {
                if (opened) return; opened = true;
                const tl = gsap.timeline();
                tl.to("#flap", {rotateX: 180, duration: 1.1, ease: "power3.inOut"})
                    .set("#flap", {zIndex: 1})
                    .to(".paper", {y: "-60%", duration: .9, ease: "power2.out"})
                    .to("#env", {opacity: 0, y: 60, duration: .9, ease: "power2.in"}, "+=.2")
                    .set("#env", {display: "none"})
                    .set(sheet, {display: "block"})
                    .from(sheet, {y: 60, opacity: 0, duration: 1.1, ease: "power3.out"})
                    .to(allCh, {opacity: 1, duration: .05, stagger: REDUCED ? 0 : .022}, "-=.2");
                tl.eventCallback("onComplete", () => ScrollTrigger.refresh());
                gsap.to(dust, {boost: .6, duration: 2, yoyo: true, repeat: 1});
            });
        })();

        addEventListener("load", () => ScrollTrigger.refresh());
    </script>
</body>
